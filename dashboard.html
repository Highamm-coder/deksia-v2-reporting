<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deksia · Dataflow State</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a212b; --panel2:#222c38; --line:#2c3744;
    --txt:#e7edf3; --muted:#8da0b3; --accent:#4da3ff;
    --fresh:#34a853; --stale:#f5a623; --nodata:#3a4654; --na:#222c38;
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
  header .sub{color:var(--muted);font-size:12px}
  header .spacer{flex:1}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  main{padding:24px;max-width:1200px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .stat .n{font-size:24px;font-weight:700} .stat .l{color:var(--muted);font-size:12px;margin-top:2px}
  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:57px;background:var(--panel)}
  tr:last-child td{border-bottom:none}
  td.client{font-weight:600;white-space:nowrap}
  .cell{display:flex;flex-direction:column;gap:2px;border-radius:7px;padding:7px 9px;min-width:104px}
  .cell.fresh{background:rgba(52,168,83,.13);box-shadow:inset 0 0 0 1px rgba(52,168,83,.35)}
  .cell.stale{background:rgba(245,166,35,.12);box-shadow:inset 0 0 0 1px rgba(245,166,35,.35)}
  .cell.no_data{background:rgba(58,70,84,.25);box-shadow:inset 0 0 0 1px var(--line)}
  .cell .top{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px;text-transform:capitalize}
  .dot{width:8px;height:8px;border-radius:50%}
  .dot.fresh{background:var(--fresh)} .dot.stale{background:var(--stale)} .dot.no_data{background:var(--nodata)}
  .cell .meta{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .na{color:#3a4654;text-align:center;font-size:18px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 14px;color:var(--muted);font-size:12px;align-items:center}
  .legend .dot{display:inline-block;margin-right:5px;vertical-align:middle}
  #status{color:var(--muted);margin-bottom:10px} .err{color:#ea4335;padding:14px;background:var(--panel);border:1px solid #ea4335;border-radius:8px}
  code{background:var(--bg);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>Deksia <span style="color:var(--muted)">·</span> Dataflow State</h1>
  <div class="sub" id="generated"></div>
  <div class="spacer"></div>
  <button id="refresh">↻ Refresh</button>
  <button id="settings">⚙ Connection</button>
</header>
<div id="tokenbar" style="display:none;padding:12px 24px;background:var(--panel2);border-bottom:1px solid var(--line)">
  <span style="color:var(--muted);margin-right:8px">Access token (Vault <code>ingest_token</code>):</span>
  <input id="tokenInput" type="password" placeholder="paste token…" autocomplete="off"
    style="background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:380px;font:13px monospace" />
  <button id="tokenSave" style="margin-left:8px">Save &amp; load</button>
</div>
<main>
  <div id="status"></div>
  <div id="error"></div>
  <div class="cards" id="stats"></div>
  <div class="legend">
    <span><span class="dot fresh"></span>Fresh (synced ≤ 2 days)</span>
    <span><span class="dot stale"></span>Stale (configured, sync overdue)</span>
    <span><span class="dot no_data"></span>No data yet (configured, never synced)</span>
    <span><span class="na">·</span> not configured</span>
  </div>
  <div id="matrix"></div>
</main>

<script>
const FN_BASE = "https://ykxauddrsnuwkvimkdhw.supabase.co/functions/v1";
const LS_TOKEN = "deksia_dash_token";
const SOURCES = ["google_ads","meta","ga4","callrail","pages"];
const SRC_LABEL = {google_ads:"Google Ads", meta:"Meta", ga4:"GA4", callrail:"CallRail", pages:"Pages"};

function getToken(){ return (localStorage.getItem(LS_TOKEN)||"").trim(); }
function showTokenBar(s){ document.getElementById("tokenbar").style.display=s?"block":"none";
  if(s){ const i=document.getElementById("tokenInput"); i.value=getToken(); i.focus(); } }
function setStatus(m){ document.getElementById("status").textContent=m||""; }
function showErr(m){ document.getElementById("error").innerHTML=m?`<div class="err">${m}</div>`:""; }
function fmtDate(s){ if(!s) return "—"; const d=new Date(s); return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }

async function load(){
  showErr("");
  const tok=getToken();
  if(!tok){ showErr("No access token set — paste it above and click Save & load."); showTokenBar(true); return; }
  setStatus("Loading…");
  let res;
  try{ res=await fetch(`${FN_BASE}/dashboard-data`,{headers:{Authorization:`Bearer ${tok}`}}); }
  catch(e){ setStatus(""); return showErr("Network error: "+e.message+". If this panel can't reach the internet, open dashboard.html in a normal browser."); }
  if(res.status===401){ setStatus(""); showTokenBar(true); return showErr("Unauthorized — token rejected. Re-enter it above."); }
  if(!res.ok){ setStatus(""); return showErr("Error "+res.status+": "+(await res.text())); }
  const data=await res.json();
  setStatus(""); showTokenBar(false);
  document.getElementById("generated").textContent="as of "+fmtDate(data.generated_at);
  render(data.pipeline||[]);
}

function render(rows){
  // index by client -> source
  const clients={}; let lastSync=null;
  const counts={fresh:0,stale:0,no_data:0}, rows30={};
  rows.forEach(r=>{
    (clients[r.slug]=clients[r.slug]||{})[r.source]=r;
    counts[r.sync_status]=(counts[r.sync_status]||0)+1;
    rows30[r.source]=(rows30[r.source]||0)+(r.rows_30d||0);
    if(r.last_ingested_at && (!lastSync||r.last_ingested_at>lastSync)) lastSync=r.last_ingested_at;
  });
  const totalRows=Object.values(rows30).reduce((a,b)=>a+b,0);

  document.getElementById("stats").innerHTML=[
    ["Clients", Object.keys(clients).length, "var(--accent)"],
    ["Flowing", counts.fresh, "var(--fresh)"],
    ["Stale", counts.stale, "var(--stale)"],
    ["No data", counts.no_data, "var(--nodata)"],
    ["Rows (30d)", totalRows.toLocaleString(), "var(--txt)"],
    ["Last sync", fmtDate(lastSync), "var(--txt)"],
  ].map(([l,n,c])=>`<div class="stat"><div class="n" style="color:${c};font-size:${String(n).length>8?'15px':'24px'}">${n}</div><div class="l">${l}</div></div>`).join("");

  let h=`<table><thead><tr><th>Client</th>${SOURCES.map(s=>`<th>${SRC_LABEL[s]}</th>`).join("")}</tr></thead><tbody>`;
  Object.keys(clients).sort().forEach(slug=>{
    h+=`<tr><td class="client">${slug}</td>`;
    SOURCES.forEach(s=>{
      const r=clients[slug][s];
      if(!r){ h+=`<td><div class="na">·</div></td>`; return; }
      const rowsTxt = r.rows_30d ? `${r.rows_30d.toLocaleString()} rows · ${r.metric_count} metrics` : "—";
      h+=`<td><div class="cell ${r.sync_status}">
            <div class="top"><span class="dot ${r.sync_status}"></span>${r.sync_status.replace("_"," ")}</div>
            <div class="meta">${r.last_metric_date||"no data"}${r.id_count>1?` · ${r.id_count} accts`:""}</div>
            <div class="meta">${rowsTxt}</div>
          </div></td>`;
    });
    h+=`</tr>`;
  });
  h+=`</tbody></table>`;
  document.getElementById("matrix").innerHTML=h;
}

document.getElementById("refresh").onclick=load;
document.getElementById("settings").onclick=()=>showTokenBar(document.getElementById("tokenbar").style.display==="none");
document.getElementById("tokenSave").onclick=()=>{ const v=document.getElementById("tokenInput").value.trim(); if(v) localStorage.setItem(LS_TOKEN,v); load(); };
document.getElementById("tokenInput").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("tokenSave").click(); });
load();
</script>
</body>
</html>
