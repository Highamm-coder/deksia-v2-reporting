<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deksia · Client Performance & SMART Goals</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a212b; --panel2:#222c38; --line:#2c3744;
    --txt:#e7edf3; --muted:#8da0b3; --accent:#4da3ff;
    --fresh:#34a853; --stale:#f5a623; --nodata:#6b7785;
    --on:#34a853; --risk:#f5a623; --off:#ea4335; --achieved:#2e8bff; --missed:#ea4335; --pending:#6b7785;
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
  header .sub{color:var(--muted);font-size:12px}
  header .spacer{flex:1}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  main{padding:24px;max-width:1280px;margin:0 auto}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:28px 0 12px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:8px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .stat .n{font-size:24px;font-weight:700} .stat .l{color:var(--muted);font-size:12px;margin-top:2px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  tr:last-child td{border-bottom:none}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;text-transform:capitalize}
  .pill.fresh{background:rgba(52,168,83,.16);color:var(--fresh)} .pill.stale{background:rgba(245,166,35,.16);color:var(--stale)} .pill.no_data{background:rgba(107,119,133,.18);color:var(--nodata)}
  .pill.on_track{background:rgba(52,168,83,.16);color:var(--on)} .pill.at_risk{background:rgba(245,166,35,.16);color:var(--risk)} .pill.off_track{background:rgba(234,67,53,.16);color:var(--off)}
  .pill.achieved{background:rgba(46,139,255,.16);color:var(--achieved)} .pill.missed{background:rgba(234,67,53,.16);color:var(--missed)} .pill.pending{background:rgba(107,119,133,.18);color:var(--pending)}
  .bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;min-width:80px}
  .bar > i{display:block;height:100%;border-radius:4px}
  .attn{box-shadow:inset 3px 0 0 var(--off)}
  .group-title{margin:18px 0 6px;font-weight:600;font-size:13px;color:var(--txt)}
  .muted{color:var(--muted)} .err{color:var(--off);padding:14px;background:var(--panel);border:1px solid var(--off);border-radius:8px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 0;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Deksia <span class="muted">·</span> Client Performance &amp; SMART Goals</h1>
  <div class="sub" id="generated"></div>
  <div class="spacer"></div>
  <button id="refresh">↻ Refresh</button>
  <button id="settings">⚙ Connection</button>
</header>
<div id="tokenbar" style="display:none;padding:12px 24px;background:var(--panel2);border-bottom:1px solid var(--line)">
  <span class="muted" style="margin-right:8px">Access token (Vault <code>ingest_token</code>):</span>
  <input id="tokenInput" type="password" placeholder="paste token…" autocomplete="off"
    style="background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:380px;font:13px monospace" />
  <button id="tokenSave" style="margin-left:8px">Save &amp; load</button>
</div>
<main>
  <div id="status" class="muted" style="margin-bottom:10px"></div>
  <div id="error"></div>

  <h2>Pipeline Health</h2>
  <div class="cards" id="pipeStats"></div>
  <div id="pipeTable"></div>

  <h2>Goal Scoreboard</h2>
  <div id="goalZone"></div>
</main>

<script>
const FN_BASE = "https://ykxauddrsnuwkvimkdhw.supabase.co/functions/v1";
const LS_TOKEN = "deksia_dash_token";

function getToken(){ return (localStorage.getItem(LS_TOKEN)||"").trim(); }
function showTokenBar(show){ document.getElementById("tokenbar").style.display = show?"block":"none";
  if(show){ const i=document.getElementById("tokenInput"); i.value=getToken(); i.focus(); } }

function pill(s){ return `<span class="pill ${s}">${(s||"").replace(/_/g," ")}</span>`; }
function num(v,d=0){ return v==null? "—" : Number(v).toLocaleString(undefined,{maximumFractionDigits:d}); }
function fmtDate(s){ if(!s) return "—"; const d=new Date(s); return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }

function setStatus(m){ document.getElementById("status").textContent = m||""; }
function showErr(m){ document.getElementById("error").innerHTML = m?`<div class="err">${m}</div>`:""; }

async function load(){
  showErr("");
  const tok=getToken();
  if(!tok){ setStatus(""); showErr("No access token set — paste it in the bar above and click Save & load."); showTokenBar(true); return; }
  setStatus("Loading…");
  let res;
  try{ res = await fetch(`${FN_BASE}/dashboard-data`,{headers:{Authorization:`Bearer ${tok}`}}); }
  catch(e){ setStatus(""); return showErr("Network error reaching the data endpoint: "+e.message+". If this panel can't reach the internet, open dashboard.html in a normal browser."); }
  if(res.status===401){ setStatus(""); showTokenBar(true); return showErr("Unauthorized — token rejected. Re-enter it above."); }
  if(!res.ok){ setStatus(""); return showErr("Error "+res.status+": "+(await res.text())); }
  const data = await res.json();
  setStatus(""); showErr(""); showTokenBar(false);
  document.getElementById("generated").textContent = "as of "+fmtDate(data.generated_at);
  renderPipeline(data.pipeline||[]);
  renderGoals(data.goals||[]);
}

function renderPipeline(rows){
  const counts={fresh:0,stale:0,no_data:0};
  rows.forEach(r=>counts[r.sync_status]=(counts[r.sync_status]||0)+1);
  document.getElementById("pipeStats").innerHTML = [
    ["Sources tracked", rows.length, "var(--accent)"],
    ["Fresh", counts.fresh, "var(--fresh)"],
    ["Stale", counts.stale, "var(--stale)"],
    ["No data yet", counts.no_data, "var(--nodata)"],
  ].map(([l,n,c])=>`<div class="stat"><div class="n" style="color:${c}">${n}</div><div class="l">${l}</div></div>`).join("");
  let h=`<table><thead><tr><th>Client</th><th>Source</th><th>Status</th><th>Last data</th><th>Last sync</th><th class="num">Rows 30d</th><th class="num">Metrics</th></tr></thead><tbody>`;
  rows.forEach(r=>{ const attn = r.sync_status!=="fresh" ? "attn":"";
    h+=`<tr class="${attn}"><td>${r.slug}</td><td class="muted">${r.source}</td><td>${pill(r.sync_status)}</td>
        <td>${r.last_metric_date||"—"}</td><td class="muted">${fmtDate(r.last_ingested_at)}</td>
        <td class="num">${num(r.rows_30d)}</td><td class="num">${num(r.metric_count)}</td></tr>`; });
  h+=`</tbody></table>`;
  document.getElementById("pipeTable").innerHTML=h;
}

function renderGoals(rows){
  if(!rows.length){ document.getElementById("goalZone").innerHTML=`<p class="muted">No active goals yet.</p>`; return; }
  const byClient={}; rows.forEach(r=>(byClient[r.slug]=byClient[r.slug]||[]).push(r));
  const statusColor={on_track:"var(--on)",at_risk:"var(--risk)",off_track:"var(--off)",achieved:"var(--achieved)",missed:"var(--missed)",pending:"var(--pending)"};
  let h="";
  Object.keys(byClient).sort().forEach(slug=>{
    h+=`<div class="group-title">${slug}</div><table><thead><tr><th>Metric</th><th>Source</th><th class="num">Current</th><th class="num">Target</th><th style="width:160px">Progress</th><th>Status</th><th class="num">Days left</th></tr></thead><tbody>`;
    byClient[slug].forEach(g=>{
      const pct = g.pct_to_target==null?0:Math.max(0,Math.min(1,Number(g.pct_to_target)));
      const col = statusColor[g.status]||"var(--muted)";
      const attn = g.needs_attention?"attn":"";
      h+=`<tr class="${attn}"><td>${g.metric_name}</td><td class="muted">${g.source}</td>
          <td class="num">${num(g.current_value, g.current_value!=null&&g.current_value<100?2:0)}</td>
          <td class="num">${num(g.target_value, g.target_value<100?2:0)}</td>
          <td><div class="bar"><i style="width:${(pct*100).toFixed(0)}%;background:${col}"></i></div>
              <span class="muted" style="font-size:11px">${g.pct_to_target==null?"—":(pct*100).toFixed(0)+"%"}</span></td>
          <td>${pill(g.status)}</td>
          <td class="num ${g.days_remaining<0?'muted':''}">${g.days_remaining}</td></tr>`;
    });
    h+=`</tbody></table>`;
  });
  document.getElementById("goalZone").innerHTML=h;
}

document.getElementById("refresh").onclick=load;
document.getElementById("settings").onclick=()=>showTokenBar(document.getElementById("tokenbar").style.display==="none");
document.getElementById("tokenSave").onclick=()=>{
  const v=document.getElementById("tokenInput").value.trim();
  if(v) localStorage.setItem(LS_TOKEN,v);
  load();
};
document.getElementById("tokenInput").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("tokenSave").click(); });
load();
</script>
</body>
</html>
