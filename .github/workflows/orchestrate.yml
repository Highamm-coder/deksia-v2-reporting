name: deksia-daily-sync

# Fully headless daily refresh: pull each client's metrics direct from the vendor APIs
# (GA4 Data API, Meta Graph, CallRail v3, Google Sheets Ledger) -> ingest-metrics ->
# run the SMART goal tracker. No Claude session or desktop app required. Idempotent.
# 11:00 UTC ~ 07:00 America/New_York — yesterday's data is fully closed by then.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Override date (YYYY-MM-DD, America/New_York). Blank = yesterday."
        required: false
      run_start:
        description: "Backfill window start (YYYY-MM-DD). Use with run_end; overrides run_date."
        required: false
      run_end:
        description: "Backfill window end (YYYY-MM-DD)."
        required: false
      only_slug:
        description: "Pull one client only (slug). Blank = every active client."
        required: false
      probe_only:
        description: "Connection test only — probe every mapped account, skip pulls."
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # run.mjs uses only Node built-ins (node:crypto + fetch) — no install step needed.
      - name: Run daily sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          CALLRAIL_API_KEY: ${{ secrets.CALLRAIL_API_KEY }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
          RUN_START: ${{ github.event.inputs.run_start }}
          RUN_END: ${{ github.event.inputs.run_end }}
          ONLY_SLUG: ${{ github.event.inputs.only_slug }}
          PROBE_ONLY: ${{ inputs.probe_only && '1' || '' }}
        run: node orchestrator/run.mjs
